name: Deployment workflow
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get our project
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Check syntax errors
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get our project
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Test project
        run: npm run test
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get our project
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Deploy project
        run: echo "deployed ..."